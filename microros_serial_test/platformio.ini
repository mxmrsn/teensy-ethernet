; Minimal micro-ROS node over SERIAL transport for Teensy 4.1.
; Dependency-free comms test (counter publisher + command subscriber) -- no DAC,
; no NeoPixel, nothing that requires the BCC hardware to be attached. Pairs with
; a micro_ros_agent (serial) running in WSL on ROS2 Jazzy.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200

; micro-ROS transport + distro. The distro MUST match the agent (Jazzy) so the
; precompiled micro-ROS library that micro_ros_platformio pulls is ABI-compatible.
board_microros_transport = serial
board_microros_distro = jazzy

lib_deps =
	https://github.com/micro-ROS/micro_ros_platformio
