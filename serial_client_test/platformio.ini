; Standalone serial client (NO ROS) for Teensy 4.1
; Baseline comms test to validate the link before layering micro-ROS on top.
; Mirrors the data flows of ../bcc_board_reference_ros2 but over a plain
; line-based serial protocol with zero external dependencies.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
; USB CDC serial -- baud is effectively ignored by the Teensy USB stack
; (runs at full USB speed), but the host still opens the port with a baud value.
monitor_speed = 115200
