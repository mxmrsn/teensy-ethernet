; High-performance micro-ROS node over ETHERNET/UDP for Teensy 4.1.
; Custom transport on QNEthernet (lwIP, non-blocking) + best-effort QoS, tuned
; for >500 Hz publish rates. Pairs with: micro_ros_agent udp4 --port 8888

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200

; Custom transport: we supply UDP read/write via QNEthernet (no built-in
; transport is compiled into the micro-ROS lib).
board_microros_transport = custom
board_microros_distro = jazzy
; Rebuild-time rmw_microxrcedds tuning (entity caps + MTU).
board_microros_user_meta = colcon.meta

lib_deps =
	https://github.com/micro-ROS/micro_ros_platformio
	ssilverman/QNEthernet@^0.29.0

build_flags = -O2

; Optional headroom (NOT needed for >500 Hz): overclock the 600 MHz M7.
; board_build.f_cpu = 720000000
